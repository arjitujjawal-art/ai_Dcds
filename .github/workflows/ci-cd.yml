name: QueryMind 2.0 CI/CD & Deployment Verification

on:
  push:
    branches: [ main, querymind-2.0 ]
  pull_request:
    branches: [ main, querymind-2.0 ]

jobs:
  test-and-verify:
    name: Automated Test Suite & Pre-Flight Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Flight Deployment Audit
        run: |
          python check_deployment.py

      - name: Run Pytest Comprehensive Test Suite
        run: |
          pytest tests/ -v
